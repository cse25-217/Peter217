<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoMechanical Spares Hunters</title>
    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- External CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav class="custom-navbar">

            <section class="logo">

                <a href="index.html">

                  <img src="logo.png"
                  alt="AutoMechanical Spares Hunters Logo"
                  width="220"
                  height="120">

                </a>

            </section>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="suppliers.html">Suppliers</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>

    <main>

        <section class="page-banner">

            <h2>Contact Us</h2>

            <p>
                Send us your inquiries or supplier requests.
            </p>

        </section>

        <section class="contact-form-section">

            <form class="contact-form">

                <label for="fullname">
                    Full Name
                </label>

                <input type="text"
                    id="fullname"
                    name="fullname"
                    required>

                <label for="email">
                    Email Address
                </label>

                <input type="email"
                    id="email"
                    name="email"
                    required>

                <label for="phone">
                    Phone Number
                </label>

                <input type="tel"
                    id="phone"
                    name="phone"
                    required>

                <label for="message">
                    Message
                </label>

                <textarea id="message"
                    name="message"
                    rows="6"
                    required></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>

        <section class="footer-bottom">

            <p>
                &copy; 2026 AutoMechanical Spares Hunters
            </p>

        </section>

    </footer>
<!-- Bootstrap JS and dependencies -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
